name: Build and Deploy Arcana to All-Inkl

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚡ Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 📦 Install Dependencies
      run: flutter pub get

    - name: 🏗️ Build Project
      run: flutter build web --release --web-renderer canvaskit

    - name: 🔧 Install LFTP
      run: sudo apt-get install -y lftp

    - name: 📂 Sync files via LFTP
      run: |
        lftp -e "set ftp:ssl-auth TLS; set ftp:ssl-force true; set ssl:verify-certificate no; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; mirror -R --verbose --parallel=2 ./build/web /arcana; quit"