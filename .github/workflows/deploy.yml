name: Build and Deploy Arcana to All-Inkl

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚡ Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 📦 Install Dependencies
      run: flutter pub get

    - name: 🏗️ Build Project
      run: flutter build web --release --base-href "/arcana/" --web-renderer canvaskit

    - name: � Install LFTP
      run: sudo apt-get install -y lftp

    - name: 📂 Sync files via LFTP
      run: |
        # 1. Create a hidden credentials file safely
        # This prevents special characters in your password from breaking the script
        echo "machine ${{ secrets.FTP_SERVER }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc
        chmod 600 ~/.netrc

        # 2. Run LFTP (It will read the password from the file automatically)
        lftp -e "set ftp:ssl-auth TLS; set ftp:ssl-force true; set ssl:verify-certificate no; mirror -R --verbose --parallel=2 ./build/web /arcana; quit" ${{ secrets.FTP_SERVER }}