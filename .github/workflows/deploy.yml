name: Build and Deploy Arcana to All-Inkl

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚡ Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 📦 Install Dependencies
      run: flutter pub get

    # Added --base-href "/arcana/" so the app knows it lives in a subfolder
    - name: 🏗️ Build Project
      run: flutter build web --release --base-href "/arcana/" --web-renderer canvaskit

    - name: 🔧 Install LFTP
      run: sudo apt-get install -y lftp

    # FIX: Use environment variables and script file to handle special characters in password
    - name: 📂 Sync files via LFTP
      env:
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        FTP_HOST: ${{ secrets.FTP_SERVER }}
      run: |
        echo "open -u $FTP_USER,$FTP_PASS $FTP_HOST; set ftp:ssl-auth TLS; set ftp:ssl-force true; set ssl:verify-certificate no; mirror -R --verbose --parallel=2 ./build/web /arcana; quit" > upload_script.txt
        lftp -f upload_script.txt