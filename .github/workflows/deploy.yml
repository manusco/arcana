name: Build and Deploy Arcana to All-Inkl

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚡ Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 📦 Install Dependencies
      run: flutter pub get

    - name: 🏗️ Build Project
      run: flutter build web --release --base-href /arcana/

    - name: 📂 Sync files (The Safe Way)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/web/
        server-dir: /arcana/
        exclude: |
          **/.git*
          **/.git*/**